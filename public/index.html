<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>cloudBoard</title>
  <meta name="description" content="Check your AWS S3 buckets, SQS queues and CloudWatch alarms, metrics and logs from your phone.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <script>
    // Set the theme before the first paint so there is no flash of the wrong one.
    try {
      var t = JSON.parse(localStorage.getItem('cb:theme') || '"system"');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="boot" class="boot"><img class="boot-mark" src="/logo.svg" alt=""></div>

  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="brand">
        <img class="brand-logo" src="/logo.svg" alt="">
        <span>cloud<b>Board</b></span>
      </div>
      <div id="login-fields"></div>
      <p id="login-error" class="form-error" role="alert"></p>
      <button id="login-submit" class="btn primary block" type="submit">Connect</button>
    </form>
  </section>

  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Open menu" aria-controls="drawer" hidden></button>
      <a id="back-btn" class="icon-btn" href="#/" aria-label="Back" hidden></a>
      <div class="titles">
        <span id="crumb" class="crumb" hidden></span>
        <h1 id="title">cloudBoard</h1>
      </div>
      <button id="region-btn" class="region-pill" type="button" aria-label="Change region"></button>
      <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh"></button>
      <a id="settings-btn" class="icon-btn" href="#/settings" aria-label="Settings"></a>
    </header>
    <nav id="drawer" class="drawer" aria-label="All services"></nav>
    <div id="scrim" class="scrim" hidden></div>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Services"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
